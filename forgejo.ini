APP_NAME = VCS Benchmark
RUN_USER = dev
RUN_MODE = prod
WORK_PATH = /tmp/vcs-agent-bench/forgejo

[database]
DB_TYPE = sqlite3
PATH = /tmp/vcs-agent-bench/forgejo/data/forgejo.db

[repository]
ROOT = /tmp/vcs-agent-bench/forgejo/repos

[server]
DOMAIN = 127.0.0.1
HTTP_ADDR = 127.0.0.1
HTTP_PORT = 30077
ROOT_URL = http://127.0.0.1:30077/
DISABLE_SSH = true
LFS_START_SERVER = false

[security]
INSTALL_LOCK = true
SECRET_KEY = vcs-benchmark-not-for-production
INTERNAL_TOKEN = vcs-benchmark-internal-token-not-for-production

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = false

[log]
MODE = console
LEVEL = warn
ROOT_PATH = /tmp/vcs-agent-bench/forgejo/log

[oauth2]
JWT_SECRET = XNqcKUneJeVamCDnlrzek8g9bldpEntI43TZBZlwEZE
